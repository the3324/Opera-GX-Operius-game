        <canvas id="canvas" width="426" height="240"

        </canvas>

    <!-- Touchscreen ESC button -->
    <button id="escapeButton" type="button">ESC</button>

    <script>
        const escapeButton = document.getElementById("escapeButton");

        function pressEscape() {
            const canvas = document.getElementById("canvas");

            const eventOptions = {
                key: "Escape",
                code: "Escape",
                keyCode: 27,
                which: 27,
                bubbles: true,
                cancelable: true
            };

            canvas.dispatchEvent(new KeyboardEvent("keydown", eventOptions));
            canvas.dispatchEvent(new KeyboardEvent("keyup", eventOptions));

            document.dispatchEvent(new KeyboardEvent("keydown", eventOptions));
            document.dispatchEvent(new KeyboardEvent("keyup", eventOptions));

            window.dispatchEvent(new KeyboardEvent("keydown", eventOptions));
            window.dispatchEvent(new KeyboardEvent("keyup", eventOptions));
        }

        escapeButton.addEventListener("pointerdown", function(event) {
            event.preventDefault();
            event.stopPropagation();
            pressEscape();
        });
    </script>
